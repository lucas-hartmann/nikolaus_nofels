# Netlify configuration.
# Build settings and the Next.js runtime are configured in the Netlify UI /
# auto-detected. This file only declares the serverless functions directory
# (used by netlify/functions/submission-created.mjs).

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # nodemailer uses dynamic requires that don't bundle cleanly – ship it as-is.
  external_node_modules = ["nodemailer"]
